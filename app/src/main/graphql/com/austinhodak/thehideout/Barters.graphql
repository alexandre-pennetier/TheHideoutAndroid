query Barters(
    $lang: LanguageCode,
    $limit: Int,
    $offset: Int,
    $gameMode: GameMode
) {
    barters(gameMode: $gameMode, lang: $lang, limit: $limit, offset: $offset) {
        requiredItems {
            ...TaskItem
        }
        rewardItems {
            ...TaskItem
        }
        id
        trader {
            id
        }
        level
        taskUnlock {
            id
        }
    }
}