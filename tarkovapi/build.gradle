plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.apollo)
    alias(libs.plugins.ksp)
    alias(libs.plugins.dagger.hilt.android)
    alias(libs.plugins.room)
}

apollo {
    service("service") {
        packageName.set("com.austinhodak.tarkovapi")
        // Enums no longer selected by any query but still used by Kotlin code.
        alwaysGenerateTypesMatching.set(["ItemSourceName", "RequirementType"])
        introspection {
            endpointUrl.set("https://api.tarkov.dev/graphql")
            schemaFile.set(file("src/main/graphql/com/austinhodak/tarkovapi/schema.graphqls"))
        }
    }
}

android {
    compileSdk 37

    defaultConfig {
        minSdk 23

//        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "proguard-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.austinhodak.tarkovapi'

}

kotlin {
    jvmToolchain(17)
}

room {
    schemaDirectory("$projectDir/schemas")
}

dependencies {
    implementation(platform(androidx.compose.bom))

    api(libs.apollo.runtime)
    api(libs.apollo.normalized.cache)
    api(libs.apollo.normalized.cache.sqlite)

    implementation(androidx.core)
    implementation(libs.material)
    implementation(androidx.compose.ui.graphics)

    implementation(libs.kotlinx.datetime)

    implementation(libs.dagger.hilt.android)
    ksp(libs.dagger.hilt.compiler)

    api(androidx.room.runtime)
    ksp(androidx.room.compiler)

    implementation(androidx.room)

    implementation 'com.google.code.gson:gson:2.10.1'


    api "com.github.MFlisar.MaterialPreferences:core:1.1.2"
    api "com.github.MFlisar.MaterialPreferences:datastore:1.1.2"

    api "androidx.work:work-runtime-ktx:2.7.1"
    api 'com.github.stealthcopter:AndroidNetworkTools:0.4.5.3'
}