# Legacy Room quest data, now built from the tasks API (root quests was deprecated).
query Quests($gameMode: GameMode) {
    quests: tasks(gameMode: $gameMode) {
        ...QuestFragment
    }
}

fragment QuestFragment on Task {
    id
    tarkovDataId
    name
    wikiLink
    experience
    minPlayerLevel
    trader {
        id
        name
    }
    taskRequirements {
        task {
            tarkovDataId
        }
    }
    finishRewards {
        offerUnlock {
            item {
                id
            }
        }
    }
    objectives {
        id
        type
        description
        maps {
            tarkovDataId
        }
        ... on TaskObjectiveItem {
            count
            items {
                ...ItemFragment
            }
        }
        ... on TaskObjectiveQuestItem {
            count
            questItem {
                name
            }
        }
        ... on TaskObjectiveShoot {
            count
            targetNames
        }
        ... on TaskObjectiveSkill {
            skillLevel {
                name
                level
            }
        }
        ... on TaskObjectiveTraderLevel {
            level
            trader {
                tarkovDataId
            }
        }
    }
}
