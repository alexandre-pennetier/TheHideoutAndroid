query Crafts($gameMode: GameMode) {
    crafts(gameMode: $gameMode) {
        id
        level
        duration
        requiredItems {
            ...TaskItem
        }
        rewardItems {
            ...TaskItem
        }
        station {
            id
            name
            tarkovDataId
        }
    }
}

fragment TaskItem on ContainedItem {
    item {
        ...ItemFragment
    }
    count
    attributes {
        type
        name
        value
    }
}